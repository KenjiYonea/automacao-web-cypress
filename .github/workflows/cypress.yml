
name: Cypress E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Executar testes Cypress
        uses: cypress-io/github-action@v7
        with:
          browser: electron
        env:
          CYPRESS_email: ${{ secrets.CYPRESS_EMAIL }}
          CYPRESS_senha: ${{ secrets.CYPRESS_SENHA }}
          CYPRESS_nome: ${{ secrets.CYPRESS_NOME }}
          CYPRESS_senhaCadastro: ${{ secrets.CYPRESS_SENHA_CADASTRO }}

      - name: Consolidar relatorios Mochawesome
        if: always()
        run: npm run report:merge
        continue-on-error: true

      - name: Gerar relatorio HTML
        if: always()
        run: npm run report:html
        continue-on-error: true

      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: cypress/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar screenshots de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-cypress
          path: cypress/screenshots/
          if-no-files-found: ignore
